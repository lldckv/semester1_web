<!DOCTYPE html>
<html>
 <head>
  <title>lldckv</title><meta charset="utf-8">
 </head>
 <body>
 
    <h4>lldckv</h4>
    <input type="number" value = "" id="n1">
    <input type="number" value = "" id="n2">
    <input type="number" value = "" id="n3">
    <input type="number" value = "" id="n4">
    <input type="number" value = "" id="n5">
    <input type="number" value = "" id="n6">
    <input type="number" value = "" id="result1">
    <input type="number" value = "" id="result2">
    <button id="bt" onclick="
                                      
      /* извлечение данных */  
      const a1 = Number(document.querySelector('#n1').value);
      const b1 = Number(document.querySelector('#n2').value); 
      const c1 = Number(document.querySelector('#n3').value);
      const a2 = Number(document.querySelector('#n4').value);
      const b2 = Number(document.querySelector('#n5').value);
      const c2 = Number(document.querySelector('#n6').value);  
    
      /* вычисления  */                       
      const D = (a1 * b2) - (b1 * a2);

      if (D === 0) {
        return 'No unique solution exists (determinant is zero).';
      }

      const Dx = (c1 * b2) - (b1 * c2);
      const Dy = (a1 * c2) - (c1 * a2);

      const result1 = Dx / D;
      const result2 = Dy / D;
       
      /* запись результата */ 
      document.querySelector('#result1').value = result1;      
      document.querySelector('#result2').value = result2;                                                          
                                                    
    ">Выполнить задание</button>
   
  
 </body>
</html>
