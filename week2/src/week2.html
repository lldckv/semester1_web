<!DOCTYPE html>
<html>
 <head>
  <title>lldckv</title><meta charset="utf-8">
 </head>
 <body>
  <h4>lldckv</h4>
  <script>
  window.onload = function () {                             
    const pathname = decodeURIComponent(window.location.search);
    const arrayMatch = pathname.match(/^\?\[(\d+),(\d+),(\d+)\]$/);
    if (arrayMatch) {
      const numbers = [parseInt(arrayMatch[1], 10), parseInt(arrayMatch[2], 10), parseInt(arrayMatch[3], 10)];
      numbers.sort((a, b) => a - b);
      document.title = numbers.toString();
    }
  }                                            
  </script>
 </body>
</html>
