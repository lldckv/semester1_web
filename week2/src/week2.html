<!DOCTYPE html>
<html>
 <head>
  <title>lldckv</title><meta charset="utf-8">
 </head>
 <body>
  <h4>lldckv</h4>
  <script>
  window.onload = function () {                             
    const pathname = window.location.search;
    const arrayMatch = pathname.match(/^\?\[\d+,\d+,\d+\]$/);
    if (arrayMatch) {
      const numbers = [parseInt(arrayMatch[1], 10), parseInt(arrayMatch[2], 10), parseInt(arrayMatch[3], 10)];
      const sorted = numbers.toSorted((a, b) => a - b);
      document.title = sorted.join(','); 
    }
  }                                            
  </script>
 </body>
</html>
